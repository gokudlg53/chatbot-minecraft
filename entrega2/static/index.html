<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Mobs de Minecraft</title>
<style>
  :root { --verde:#3b8526; --verde-o:#2a5f1b; --gris:#1e1e1e; --fondo:#f4f4f4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:var(--fondo); }
  header { background:var(--verde); color:#fff; padding:14px 20px; display:flex;
           align-items:center; gap:12px; }
  header h1 { font-size:1.2rem; margin:0; }
  .contenedor { max-width:720px; margin:20px auto; padding:0 12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tab { flex:1; padding:10px; border:none; border-radius:8px 8px 0 0; cursor:pointer;
         background:#ddd; font-weight:bold; }
  .tab.activa { background:var(--verde); color:#fff; }
  #chat { background:#fff; border:1px solid #ccc; border-radius:0 8px 8px 8px;
          height:420px; overflow-y:auto; padding:14px; }
  .msg { margin:8px 0; padding:10px 14px; border-radius:14px; max-width:85%;
         white-space:pre-wrap; line-height:1.4; }
  .usuario { background:#d7e9ff; margin-left:auto; }
  .bot { background:#e4f5dc; }
  .fila { display:flex; gap:8px; margin-top:12px; }
  input[type=text] { flex:1; padding:12px; border:1px solid #bbb; border-radius:8px;
                     font-size:1rem; }
  button.enviar { padding:12px 20px; background:var(--verde); color:#fff; border:none;
                  border-radius:8px; cursor:pointer; font-size:1rem; }
  button.enviar:hover { background:var(--verde-o); }
  .nota { color:#666; font-size:.85rem; margin-top:8px; }
  .ejemplos { margin-top:10px; }
  .ejemplos span { display:inline-block; background:#eee; border-radius:12px;
                   padding:4px 10px; margin:2px; cursor:pointer; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>🟩 Chatbot de Mobs de Minecraft</h1>
</header>
<div class="contenedor">
  <div class="tabs">
    <button class="tab activa" id="tab-llm" onclick="cambiarMotor('llm')">Versión LLM (Python)</button>
    <button class="tab" id="tab-prolog" onclick="cambiarMotor('prolog')">Versión Prolog (LPO)</button>
  </div>
  <div id="chat"></div>
  <div class="fila">
    <input type="text" id="pregunta" placeholder="Escribe tu pregunta…"
           onkeydown="if(event.key==='Enter')enviar()">
    <button class="enviar" onclick="enviar()">Enviar</button>
  </div>
  <div class="ejemplos">
    Prueba:
    <span onclick="preguntar(this)">¿Qué come la vaca?</span>
    <span onclick="preguntar(this)">¿Qué suelta el esqueleto?</span>
    <span onclick="preguntar(this)">¿A qué le teme el creeper?</span>
    <span onclick="preguntar(this)">¿Quién suelta pólvora?</span>
    <span onclick="preguntar(this)">¿Es más resistente el warden o el wither?</span>
    <span onclick="preguntar(this)">¿Qué mobs hostiles se queman con el sol?</span>
  </div>
  <p class="nota" id="estado">Motor activo: LLM</p>
</div>
<script>
let motor = 'llm';
const chat = document.getElementById('chat');

function cambiarMotor(m) {
  motor = m;
  document.getElementById('tab-llm').classList.toggle('activa', m === 'llm');
  document.getElementById('tab-prolog').classList.toggle('activa', m === 'prolog');
  document.getElementById('estado').textContent =
    'Motor activo: ' + (m === 'llm' ? 'LLM (Python)' : 'Prolog (lógica de primer orden)');
  agregar('bot', m === 'llm'
    ? 'Ahora respondo con el LLM (o el motor local si no hay API key).'
    : 'Ahora respondo con el chatbot en Prolog (lógica de primer orden).');
}

function agregar(clase, texto) {
  const div = document.createElement('div');
  div.className = 'msg ' + clase;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function preguntar(el) {
  document.getElementById('pregunta').value = el.textContent;
  enviar();
}

async function enviar() {
  const input = document.getElementById('pregunta');
  const pregunta = input.value.trim();
  if (!pregunta) return;
  input.value = '';
  agregar('usuario', pregunta);
  agregar('bot', '…');
  const cargando = chat.lastChild;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({pregunta, motor})
    });
    const data = await r.json();
    cargando.textContent = data.respuesta;
  } catch (e) {
    cargando.textContent = 'Error de conexión con el servidor.';
  }
  chat.scrollTop = chat.scrollHeight;
}

agregar('bot', '¡Hola! Pregúntame sobre los mobs de Minecraft: qué comen, qué sueltan, dónde aparecen, su vida, comportamiento, etc.');
</script>
</body>
</html>
